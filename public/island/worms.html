  .mbtn.live{background:linear-gradient(180deg,#9b5cff,#6a2cc9);box-shadow:0 6px 0 #4a1f8f}

  #searching{display:none;color:#c8b6e8;font-weight:700;margin-top:8px}

  #speech{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:55;background:rgba(11,31,42,.94);border-radius:20px;padding:14px 14px 12px;color:#fff;display:none;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  #speech .ru{font-size:13px;color:#bcd3db}
  #speech .en{font-size:24px;font-weight:900;color:#ffd23f;margin:3px 0 2px}
  #speech .heard{min-height:17px;font-size:13px;font-weight:700;margin:2px 0 8px;line-height:1.3}
  #spPhrase.tap{cursor:pointer}
  #spPhrase.tap .en{text-decoration:underline dotted;text-underline-offset:5px}
  /* живая шкала голоса вместо кнопки записи */
  .eq{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:34px;margin:6px 0 2px}
  .eq i{width:5px;border-radius:3px;background:#5ef2c9;height:4px;transition:height .07s linear}
  .eq.idle i{background:#41626f}
  #spSay{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:8px 16px;font:700 13px system-ui;cursor:pointer}
  /* тост */
  #toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:rgba(11,31,42,.95);color:#fff;padding:10px 16px;border-radius:14px;font:700 14px system-ui;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
  #toast.on{opacity:1}
</style>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="https://unpkg.com/colyseus.js@^0.16.0/dist/colyseus.js"></script>
<script>
/* =====================================================================
   WORMS-АРЕНА: речь-зарядка (Deepgram) + PvP (Colyseus worms_duel, relay)
   ===================================================================== */
const API='https://ek-pvp.13-140-178-130.sslip.io';
const WSURL='wss://ek-pvp.13-140-178-130.sslip.io';
const G=0.35;

/* ── банк боевых фраз ── */
const PHRASES=[
  {ru:'Получай банан!', en:'Take this banana!', ans:['take this banana','take the banana','take this']},
  {ru:'Я тебя достану', en:'I will get you', ans:['i will get you','i\'ll get you','i will catch you']},
  {ru:'Это мой остров', en:'This is my island', ans:['this is my island','it is my island','its my island']},
  {ru:'Ты не спрячешься', en:'You cannot hide', ans:['you cannot hide','you can\'t hide','you cant hide']},
  {ru:'Огонь!', en:'Fire!', ans:['fire','open fire']},
  {ru:'Смотри и учись', en:'Watch and learn', ans:['watch and learn','look and learn']},
  {ru:'Слишком легко', en:'Too easy', ans:['too easy','so easy','its too easy']},
  {ru:'Я чемпион', en:'I am the champion', ans:['i am the champion','i\'m the champion','i am champion']},
  {ru:'Беги, пока можешь', en:'Run while you can', ans:['run while you can','run when you can']},
  {ru:'Кокос летит к тебе', en:'Coconut is coming', ans:['coconut is coming','the coconut is coming','coconut coming']},
  {ru:'Не зли меня', en:'Do not make me angry', ans:['do not make me angry','don\'t make me angry','dont make me angry']},
  {ru:'Победа будет моей', en:'Victory will be mine', ans:['victory will be mine','the victory will be mine','victory is mine']},
];
(async function(){ try{ const r=await fetch(API+'/api/island/content',{cache:'no-store'}); const j=await r.json();
  if(j&&j.data&&Array.isArray(j.data.battle)&&j.data.battle.length){ PHRASES.length=0; j.data.battle.forEach(p=>PHRASES.push(p)); }
}catch(e){} })();
function norm(t){return String(t).toLowerCase().replace(/[.,!?;:'"()\-]/g,'').replace(/\s+/g,' ').trim();}
function matchPhrase(said,ans){ const n=norm(said); if(!n) return false; return ans.some(a=>{const na=norm(a); return n===na||n.includes(na)||na.includes(n);}); }
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1900); }
function say(text){ try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){} }

/* ── запись + Deepgram ── */
let micStream=null;
async function getMic(){
  if(micStream && micStream.getAudioTracks().some(t=>t.readyState==='live')) return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  return micStream;
}
function pickMime(list){ for(const m of list){ try{ if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; }catch(e){} } return ''; }
async function transcribe(blob){
  const ct=((blob.type||'').split(';')[0].trim())||'application/octet-stream';
  const r=await fetch(API+'/api/island/transcribe?lang=en',{method:'POST',headers:{'Content-Type':ct},body:blob});
  if(!r.ok) throw new Error('t '+r.status);
  const j=await r.json(); return (j.transcript||'').trim();
}
/* Автослушание (27.11.2026): запись открывается САМА, как в бою Острова, стоп по тишине.
   Раньше здесь была кнопка «Держи и говори»: без доступа к микрофону подпись «Говорю…»
   залипала, зарядить банан было нечем, и ход не кончался никогда. */
const mediaOK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let sharedAC=null;
function wakeAudio(){   // зовётся из жеста (кнопки меню): iOS даёт звуковой контекст только по касанию
  try{ if(!sharedAC) sharedAC=new (window.AudioContext||window.webkitAudioContext)();
       if(sharedAC.state==='suspended') sharedAC.resume(); }catch(e){}
}
async function listenOnce(words, alive, onLevel, onBusy){
  if(!mediaOK) return {fail:'nomic'};
  let stream; try{ stream=await getMic(); }catch(e){ return {fail:'denied'}; }
  if(!alive()) return {cancel:true};
  const mime=pickMime(['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg']);
  let mr; try{ mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }catch(e){ return {fail:'nomic'}; }
  const chunks=[]; mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const blobP=new Promise(res=>{ mr.onstop=()=>res(new Blob(chunks,{type:(chunks[0]&&chunks[0].type)||mime||'audio/mp4'})); });
  const t0=Date.now(); mr.start(250);
  let stopped=false, cancelled=false;
  // кодеку нужно около 650 мс, чтобы отдать первый кусок (урок iOS: иначе запись пустая)
  const halt=()=>{ if(stopped) return; stopped=true;
    const w=Math.max(0,650-(Date.now()-t0));
    setTimeout(()=>{ try{ if(mr.state!=='inactive') mr.stop(); }catch(e){} }, chunks.length?0:w); };
  wakeAudio();
  let an=null, src=null, data=null;
  try{ if(sharedAC){ an=sharedAC.createAnalyser(); an.fftSize=512; src=sharedAC.createMediaStreamSource(stream); src.connect(an); data=new Uint8Array(an.fftSize); } }catch(e){ an=null; }
  const w=words||3, SIL=w>5?1200:900, CAP=Math.min(10000, 450*w*2.5+2000);
  let floor=0, floorN=0, speaking=false, lastLoud=0, noVad=false, peak=0, ticks=0;
  // Шаг детектора зовётся и по таймеру, и на каждый кусок записи (раз в 250 мс): в фоновой или
  // перекрытой вкладке браузер душит таймеры до одного раза в секунду, и по счёту тиков
  // детектор не успевал заметить речь. Поэтому «заговорил» считаем по времени, а не по тикам.
  let loudSince=-1;
  const step=()=>{
    if(stopped) return;
    if(!alive()){ cancelled=true; halt(); return; }
    const el=Date.now()-t0; let rms=0;
    // звуковой контекст так и не проснулся - тишину от речи не отличить: пишем отрезок и отдаём как есть
    if(!an || (el>700 && sharedAC.state!=='running')){ noVad=true; if(el>Math.min(CAP,4500)) halt(); return; }
    an.getByteTimeDomainData(data);
    let sum=0; for(let i=0;i<data.length;i++){ const v=(data[i]-128)/128; sum+=v*v; }
    rms=Math.sqrt(sum/data.length); ticks++; if(rms>peak) peak=rms;
    if(el<300){ floor=(floor*floorN+rms)/(++floorN); return; }       // калибровка фона
    // Потолок фона: если человек заговорил сразу (типично на повторе «ещё раз»), калибровка
    // попадала на речь, порог улетал выше голоса и игра отвечала «не слышу» говорящему.
    const th=Math.max(0.012, Math.min(floor,0.02)*2.5);
    if(rms>th){ if(loudSince<0) loudSince=el; lastLoud=el; if(el-loudSince>=80) speaking=true; }
    else { loudSince=-1; if(!speaking) floor=floor*0.95+rms*0.05; }
    onLevel&&onLevel(Math.min(1, rms/Math.max(0.06, th*3)));
    if(speaking && el-lastLoud>SIL) halt();
    else if(el>CAP) halt();
    else if(!speaking && el>6000) halt();                              // молчит вовсе - не ждём вечно
  };
  const iv=setInterval(step, 40);
  mr.addEventListener('dataavailable', step);
  const blob=await blobP;
  clearInterval(iv); try{ src&&src.disconnect(); }catch(e){}
  // журнал слушаний для стенда и разбора жалоб: что слышал детектор речи
  (window.__vadLog=window.__vadLog||[]).push({ms:Date.now()-t0, ticks, peak:+peak.toFixed(3), floor:+floor.toFixed(4), speaking, noVad, size:blob?blob.size:0,
    ac:sharedAC&&sharedAC.state, track:(stream.getAudioTracks()[0]||{}).readyState, muted:(stream.getAudioTracks()[0]||{}).muted});
  if(cancelled || !alive()) return {cancel:true};
  if((!noVad && !speaking) || !blob || blob.size<1500) return {spoke:false};
  onBusy&&onBusy();
  try{ return {spoke:true, text:await transcribe(blob)}; }
  catch(e){ return {spoke:true, text:'', err:true}; }
}

/* ── seeded RNG для одинакового террейна у обоих игроков ── */
function lcg(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ── глобальный конфиг партии ── */
let CFG=null;   // {mode:'bot'|'pvp', W,H, seed, room?, mySid?, order?, turn?, wind?, names?}
let SCENE=null; // текущая Phaser-сцена

class Arena extends Phaser.Scene {
  create(){
    SCENE=this;
    const {W,H,seed}=CFG; const WATER_Y=H-64;
    this.W=W; this.H=H; this.WATER_Y=WATER_Y;
    const rnd=lcg(seed);
    const ph1=rnd()*6.28, ph2=rnd()*6.28;

    // небо/солнце/облака
    const sky=this.add.graphics();
    for(let i=0;i<20;i++){ const t=i/20;
      sky.fillStyle(Phaser.Display.Color.GetColor(127+t*80,211+t*20,230),1);
      sky.fillRect(0,i*H/20,W,H/20+1); }
    this.add.circle(W-140,110,55,0xfff3c0).setAlpha(.95);
    this.add.circle(W-140,110,80,0xffe680,.25);
    for(let i=0;i<4;i++){ const c=this.add.ellipse(80+i*(W/4),80+((i%2)*50),150,40,0xffffff,.8);
      this.tweens.add({targets:c,x:'+=60',duration:9000+i*2000,yoyo:true,repeat:-1}); }

    // земля (битмап, детерминирована seed'ом)
    const tex=this.textures.createCanvas('terra'+seed, W, H);
    const ctx=tex.getContext();
    ctx.fillStyle='#e8c98a';
    ctx.beginPath(); ctx.moveTo(0,WATER_Y+20);
    // против бота рельеф поднят над карточкой фразы (CFG.baseY); в живом бою он обязан совпадать у обоих игроков
    const base=CFG.baseY || Math.min(WATER_Y-96, Math.round(H*0.76));
    for(let x=0;x<=W;x+=8){
      const y=base -110*Math.sin(x/W*Math.PI) -48*Math.sin(x/170+ph1) -22*Math.sin(x/61+ph2);
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,WATER_Y+20); ctx.closePath(); ctx.fill();
    const img=ctx.getImageData(0,0,W,H), d=img.data;
    for(let x=0;x<W;x++){ let top=-1;
      for(let y=0;y<H;y++){ if(d[(y*W+x)*4+3]>50){top=y;break;} }
      if(top>=0){ for(let y=top;y<Math.min(top+10,H);y++){ const i=(y*W+x)*4; d[i]=62;d[i+1]=176;d[i+2]=94; } } }
    ctx.putImageData(img,0,0); tex.refresh();
    this.add.image(0,0,'terra'+seed).setOrigin(0).setDepth(2);
    this.terraCtx=ctx; this.terraTex=tex;
    this.alphaMap=ctx.getImageData(0,0,W,H).data;

    // вода
    const water=this.add.rectangle(W/2,(H+WATER_Y)/2+14,W,H-WATER_Y,0x2e86b5,.92).setDepth(3);
    this.tweens.add({targets:water,y:'+=6',duration:1600,yoyo:true,repeat:-1});
    this.add.rectangle(W/2,WATER_Y+16,W,6,0x7fd3e6,.8).setDepth(3);
    // декор на рельефе
    [[Math.round(W*0.06),'🌴',78],[Math.round(W*0.94),'🌴',84],[Math.round(W*0.36),'🌺',24],[Math.round(W*0.66),'🌺',22]].forEach(([x,e,s])=>
      this.add.text(x,this.surfaceY(x)+4,e,{fontSize:s+'px'}).setOrigin(.5,1).setDepth(1));
    const g2=this.make.graphics({x:0,y:0,add:false});
    g2.fillStyle(0xffffff,1); g2.fillCircle(6,6,6); g2.generateTexture('spark',12,12);

    // бойцы: A слева, B справа
    const names=CFG.names||{A:'ТЫ',B:'DON BANANA'};
    this.wormA=this.makeWorm(Math.round(W*0.19), names.A, CFG.mode==='pvp'?'🙂':'🙂', 0x3ecf6b);
    this.wormB=this.makeWorm(Math.round(W*0.81), names.B, CFG.mode==='pvp'?'🧑':'🍌', 0xff5a6e);
    this.dropWorm(this.wormA); this.dropWorm(this.wormB);
    // кто я
    this.mySeat = CFG.mode==='pvp' ? (CFG.order[0]===CFG.mySid?'A':'B') : 'A';
    this.myWorm = this.mySeat==='A'?this.wormA:this.wormB;
    this.foeWorm= this.mySeat==='A'?this.wormB:this.wormA;
    const marker=this.add.text(0,-78,'▼',{fontSize:'20px',color:'#ffd23f'}).setOrigin(.5); this.myWorm.add(marker);

    // UI
    this.ui={};
    this.ui.turn=this.add.text(W/2,36,'',{fontFamily:'system-ui',fontSize:'30px',fontStyle:'900',color:'#0b1f2a'}).setOrigin(.5).setDepth(20);
    this.ui.wind=this.add.text(W/2,74,'',{fontFamily:'system-ui',fontSize:'22px',fontStyle:'700',color:'#0b3a52'}).setOrigin(.5).setDepth(20);
    this.ui.hint=this.add.text(W/2,H-190,'⬅️ Потяни назад, как рогатку, и отпусти!',{fontFamily:'system-ui',fontSize:'22px',fontStyle:'700',color:'#ffffff'}).setOrigin(.5).setDepth(20).setShadow(0,2,'#0b1f2a',4).setVisible(false);
    this.ghost=this.add.graphics().setDepth(15);

    this.banana=null; this.busy=false; this.charged=false; this.moveLog=null;
    this.wind=CFG.wind!=null?CFG.wind:+((Math.random()*2-1).toFixed(2));

    // рогатка
    this.aiming=false;
    this.input.on('pointerdown',p=>{ if(!this.canAim()) return; this.aiming=true; this.aimStart={x:p.worldX,y:p.worldY}; });
    this.input.on('pointermove',p=>{ if(this.aiming) this.drawGhost(p); });
    this.input.on('pointerup',p=>{
      if(!this.aiming) return; this.aiming=false; this.ghost.clear();
      const v=this.aimVec(p); if(!v) return;
      if(this.missKick){ v.vx*=(0.45+Math.random()*0.95); v.vy*=(0.55+Math.random()*0.8); this.missKick=false; toast('🌀 Криво полетел!'); }
      this.charged=false;
      if(CFG.mode==='pvp'){ try{CFG.room.send('shot',{vx:v.vx,vy:v.vy});}catch(e){} this.moveLog={craters:[],drowned:[]}; }
      this.fire(this.myWorm, v.vx, v.vy, true);
    });

    // старт хода
    if(CFG.mode==='pvp'){ this.setTurn(CFG.turn===CFG.mySid?'me':'foe', CFG.wind); }
    else this.setTurn('me', this.wind);
  }

  /* ── боец ── */
  makeWorm(x,name,face,color){
    const c=this.add.container(x,300).setDepth(10);
    const body=this.add.ellipse(0,16,46,34,color);
    const head=this.add.circle(0,-12,20,0x2a4a5c);
    const f=this.add.text(0,-12,face,{fontSize:'26px'}).setOrigin(.5);
    const nm=this.add.text(0,-46,name,{fontFamily:'system-ui',fontSize:'15px',fontStyle:'800',color:'#0b1f2a'}).setOrigin(.5);
    const hpBg=this.add.rectangle(0,-62,64,9,0x0b1f2a,.5);
    const hpFg=this.add.rectangle(-31,-62,62,6,0x3ecf6b).setOrigin(0,.5);
    c.add([body,head,f,nm,hpBg,hpFg]);
    c.hp=100; c.hpFg=hpFg; c.face=f; c.alive=true; c.wname=name; c.baseFace=face;
    this.tweens.add({targets:body,scaleY:1.06,duration:900,yoyo:true,repeat:-1});
    return c;
  }
  solid(x,y){ x|=0;y|=0; if(x<0||y<0||x>=this.W||y>=this.H) return false; return this.alphaMap[(y*this.W+x)*4+3]>50; }
  surfaceY(x){ for(let y=0;y<this.H;y++){ if(this.solid(x,y)) return y; } return this.WATER_Y+40; }
  dropWorm(w){
    const y=this.surfaceY(w.x);
    if(y>this.WATER_Y){ this.drown(w); return; }
    this.tweens.add({targets:w,y:y-26,duration:220,ease:'Bounce.Out'});
  }
  drown(w){
    if(!w.alive) return; w.alive=false; w.hp=0;
    if(this.moveLog) this.moveLog.drowned.push(w===this.myWorm?CFG.mySid:(CFG.order?CFG.order.find(s=>s!==CFG.mySid):null));
    this.splash(w.x,this.WATER_Y+8);
    this.tweens.add({targets:w,y:this.H+80,angle:180,duration:900,ease:'Quad.In'});
  }

  /* ── прицел ── */
  canAim(){ return !this.busy && this.turn==='me' && this.charged && this.myWorm.alive; }
  aimVec(p){
    const dx=this.aimStart.x-p.worldX, dy=this.aimStart.y-p.worldY;
    const len=Math.hypot(dx,dy); if(len<24) return null;
    const pow=Phaser.Math.Clamp(len/230,.15,1);
    return {vx:dx/len*pow*23, vy:dy/len*pow*23};
  }
  drawGhost(p){
    const v=this.aimVec(p); this.ghost.clear(); if(!v) return;
    this.ghost.fillStyle(0xffd23f,.9);
    let x=this.myWorm.x,y=this.myWorm.y-20,vx=v.vx,vy=v.vy;
    for(let i=0;i<90;i++){ vy+=G;vx+=this.wind*0.012;x+=vx;y+=vy;
      if(i%4===0) this.ghost.fillCircle(x,y,Math.max(2.5,5-i*.04));
      if(this.solid(x,y)||y>this.WATER_Y+10) break; }
  }

  fire(from,vx,vy,mine){
    this.busy=true; this.ui.hint.setVisible(false); speechHide();
    const b=this.add.text(from.x,from.y-20,'🍌',{fontSize:'30px'}).setOrigin(.5).setDepth(12);
    this.banana={obj:b,vx,vy,mine};
  }

  update(){
    if(!this.banana) return;
    const bn=this.banana,b=bn.obj;
    bn.vy+=G; bn.vx+=this.wind*0.012;
    b.x+=bn.vx; b.y+=bn.vy; b.angle+=14;
    for(const w of [this.wormA,this.wormB]){
      if(w.alive&&Math.hypot(b.x-w.x,b.y-w.y+16)<34){ this.explode(b.x,b.y); return; }
    }
    if(this.solid(b.x,b.y)){ this.explode(b.x,b.y); return; }
    if(b.y>this.WATER_Y+12){ this.splash(b.x,this.WATER_Y+8); this.endShot(); return; }
    if(b.x<-60||b.x>this.W+60||b.y<-2500){ this.endShot(); return; }
  }

  cutCrater(x,y,r){
    const ctx=this.terraCtx;
    ctx.save(); ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation='source-atop';
    ctx.strokeStyle='rgba(90,60,20,.55)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(x,y,r+2,0,7); ctx.stroke(); ctx.restore();
    this.terraTex.refresh();
    this.alphaMap=ctx.getImageData(0,0,this.W,this.H).data;
  }
  explode(x,y,r=46){
    if(this.banana){ this.banana.obj.destroy(); this.banana=null; }
    this.cutCrater(x,y,r);
    if(this.moveLog) this.moveLog.craters.push({x:Math.round(x),y:Math.round(y),r});
    const flash=this.add.circle(x,y,r*.8,0xfff3c0,.95).setDepth(14);
    this.tweens.add({targets:flash,scale:2.2,alpha:0,duration:320,onComplete:()=>flash.destroy()});
    this.add.particles(x,y,'spark',{speed:{min:120,max:340},lifespan:600,scale:{start:1,end:0},quantity:26,tint:[0xffd23f,0xff8a3d,0xe8c98a],emitting:false}).explode(26);
    for(let i=0;i<5;i++){ const bit=this.add.text(x,y,'🍌',{fontSize:'16px'}).setDepth(14);
      this.tweens.add({targets:bit,x:x+Phaser.Math.Between(-120,120),y:y-Phaser.Math.Between(30,130),angle:Phaser.Math.Between(-300,300),alpha:0,duration:700,ease:'Quad.Out',onComplete:()=>bit.destroy()}); }
    this.cameras.main.shake(200,.012);
    for(const w of [this.wormA,this.wormB]){
      if(!w.alive) continue;
      const d=Math.hypot(w.x-x,w.y-y);
      if(d<r+56){ const dmg=Math.round(Phaser.Math.Clamp(46*(1-(d/(r+56))),8,46)); this.hurt(w,dmg,Math.sign(w.x-x)||1); }
    }
    this.time.delayedCall(240,()=>{ [this.wormA,this.wormB].forEach(w=>{ if(w.alive) this.dropWorm(w); }); });
    this.time.delayedCall(650,()=>this.endShot());
  }
  hurt(w,dmg,dir){
    w.hp=Math.max(0,w.hp-dmg);
    w.hpFg.width=62*w.hp/100;
    w.hpFg.fillColor=w.hp>50?0x3ecf6b:(w.hp>25?0xffd23f:0xff5a6e);
    const t=this.add.text(w.x,w.y-84,'-'+dmg,{fontFamily:'system-ui',fontSize:'24px',fontStyle:'900',color:'#ff5a6e'}).setOrigin(.5).setDepth(20);
    this.tweens.add({targets:t,y:'-=42',alpha:0,duration:800,onComplete:()=>t.destroy()});
    this.tweens.add({targets:w,x:w.x+dir*26,duration:200,ease:'Quad.Out'});
    w.face.setText(w.hp<=0?'😵':'😖');
    this.time.delayedCall(700,()=>{ if(w.alive&&w.hp>0) w.face.setText(w.baseFace); });
    if(w.hp<=0){ w.alive=false; this.tweens.add({targets:w,angle:90,y:'+=16',duration:500}); }
  }
  splash(x,y){
    this.add.particles(x,y,'spark',{speed:{min:80,max:240},angle:{min:230,max:310},lifespan:700,scale:{start:.9,end:0},tint:0x7fd3e6,emitting:false}).explode(22);
    this.cameras.main.shake(120,.006);
  }

  /* ── конец броска ── */
  endShot(){
    if(this.banana){ this.banana.obj.destroy(); this.banana=null; }
    if(CFG.mode==='bot'){
      if(this.checkEndLocal()) return;
      this.setTurn(this.turn==='me'?'foe':'me', +((Math.random()*2-1).toFixed(2)));
      return;
    }
    // PvP: если это был МОЙ бросок - шлю авторитарный результат; ход переключит сервер
    if(this.moveLog){
      const hp={}; hp[CFG.mySid]=this.myWorm.hp; hp[CFG.order.find(s=>s!==CFG.mySid)]=this.foeWorm.hp;
      const pos={}; pos[CFG.mySid]={x:Math.round(this.myWorm.x),y:Math.round(this.myWorm.y)};
      pos[CFG.order.find(s=>s!==CFG.mySid)]={x:Math.round(this.foeWorm.x),y:Math.round(this.foeWorm.y)};
      try{ CFG.room.send('moveDone',{hp,craters:this.moveLog.craters,pos,drowned:this.moveLog.drowned.filter(Boolean)}); }catch(e){}
      this.moveLog=null;
      this.ui.turn.setText('⏳ ...');
    }
    this.busy=false;
  }
  checkEndLocal(){
    const pDead=!this.myWorm.alive||this.myWorm.hp<=0, eDead=!this.foeWorm.alive||this.foeWorm.hp<=0;
    if(!pDead&&!eDead) return false;
    this.showEnd(eDead&&!pDead); return true;
  }
  showEnd(win){
    this.busy=true; this.turn='over'; speechHide();
    this.add.rectangle(this.W/2,this.H/2,this.W,this.H,0x0b1f2a,.55).setDepth(30);
    this.add.text(this.W/2,this.H/2-60,win?'🏆 ПОБЕДА!':'😵 ПОРАЖЕНИЕ',{fontFamily:'system-ui',fontSize:'58px',fontStyle:'900',color:win?'#ffd23f':'#ff5a6e'}).setOrigin(.5).setDepth(31);
    if(win){ try{ const LS='ek_island_v1'; const S=JSON.parse(localStorage.getItem(LS)||'{}'); S.league=S.league||{tier:0,trophies:0}; S.league.trophies+=(CFG.mode==='pvp'?25:10); localStorage.setItem(LS,JSON.stringify(S)); }catch(e){}
      this.add.text(this.W/2,this.H/2-4,CFG.mode==='pvp'?'+25 🏆':'+10 🏆',{fontFamily:'system-ui',fontSize:'30px',fontStyle:'800',color:'#ffffff'}).setOrigin(.5).setDepth(31); }
    const again=this.add.text(this.W/2,this.H/2+66,'🔄 Ещё раз',{fontFamily:'system-ui',fontSize:'32px',fontStyle:'800',color:'#ffffff',backgroundColor:'#0e9e90',padding:{x:26,y:14}}).setOrigin(.5).setDepth(31).setInteractive();
    again.on('pointerdown',()=>location.reload());
  }

  /* ── ходы ── */
  setTurn(who,wind){
    this.turn=who; this.busy=false; this.charged=false;
    if(wind!=null) this.wind=wind;
    const arrow=this.wind>0?'→':'←';
    this.ui.wind.setText('🌬 ветер '+arrow+' '+Math.abs(this.wind).toFixed(1));
    this.ui.hint.setVisible(false);
    if(who==='me'){
      this.ui.turn.setText('⚡ ТВОЙ ХОД');
      speechShow(); // сначала фраза, потом рогатка
    } else {
      this.ui.turn.setText(CFG.mode==='bot'?'🍌 ХОД DON BANANA':'⏳ ХОД '+(this.foeWorm.wname||'СОПЕРНИКА'));
      speechHide();
      if(CFG.mode==='bot'&&this.foeWorm.alive){
        this.time.delayedCall(1100,()=>{
          if(this.turn!=='foe') return;
          const dx=this.myWorm.x-this.foeWorm.x;
          const pow=Phaser.Math.Clamp(Math.abs(dx)/900+Phaser.Math.FloatBetween(-.12,.18),.3,1);
          const ang=Math.atan2(-(0.55+Phaser.Math.FloatBetween(-.1,.15)),Math.sign(dx)*(0.8+Phaser.Math.FloatBetween(-.12,.12)));
          this.fire(this.foeWorm,Math.cos(ang)*pow*23,Math.sin(ang)*pow*23,false);
        });
      }
    }
  }
  /* PvP: входящие события */
  pvpIncomingShot(m){ if(this.turn!=='foe') this.setTurn('foe'); this.fire(this.foeWorm,m.vx,m.vy,false); this.wind=m.wind; }
  pvpApplyMove(m){
    // реконсиляция: авторитарные воронки/hp/позиции от бросавшего
    (m.craters||[]).forEach(c=>this.cutCrater(c.x,c.y,c.r));
    const mySid=CFG.mySid, foeSid=CFG.order.find(s=>s!==mySid);
    if(m.hp){ if(typeof m.hp[mySid]==='number'){ this.myWorm.hp=m.hp[mySid]; this.myWorm.hpFg.width=62*this.myWorm.hp/100; }
              if(typeof m.hp[foeSid]==='number'){ this.foeWorm.hp=m.hp[foeSid]; this.foeWorm.hpFg.width=62*this.foeWorm.hp/100; } }
    if(m.pos){ const mp=m.pos[mySid], fp=m.pos[foeSid];
      if(mp) this.tweens.add({targets:this.myWorm,x:mp.x,y:mp.y,duration:250});
      if(fp) this.tweens.add({targets:this.foeWorm,x:fp.x,y:fp.y,duration:250}); }
    (m.drowned||[]).forEach(sid=>{ const w=sid===mySid?this.myWorm:this.foeWorm; if(w.alive) this.drown(w); });
  }
  pvpTurn(m){ if(m.skipped) toast('⏰ Время хода вышло'); this.setTurn(m.turn===CFG.mySid?'me':'foe', m.wind); }
  pvpEnd(winner,reason){
    if(this.turn==='over') return;
    if(reason==='left') toast('Соперник вышел 🏳️');
    this.showEnd(winner===CFG.mySid);
    try{ CFG.room&&CFG.room.leave(); }catch(e){}
  }
}

/* ── речь-зарядка (DOM поверх канваса): без кнопок, слушаем сами ── */
let curPhrase=null, listenTok=0, tapArmed=false, RT=null;
const spEl=document.getElementById('speech');
const spEq=document.getElementById('spEq');
for(let i=0;i<24;i++) spEq.appendChild(document.createElement('i'));
function eqDraw(level){ const bars=spEq.children;
  for(let i=0;i<bars.length;i++){ const mid=1-Math.abs(i-(bars.length-1)/2)/((bars.length-1)/2);
    bars[i].style.height=Math.min(34, 4+level*30*(0.35+0.65*mid)*(0.7+Math.random()*0.6))+'px'; } }
function eqIdle(on){ spEq.className='eq'+(on?' idle':''); if(on) for(const b of spEq.children) b.style.height='4px'; }
function spStatus(t,c){ const h=document.getElementById('spHeard'); h.textContent=t; h.style.color=c||'#bcd3db'; }
const myTurnOpen=()=> !!SCENE && SCENE.turn==='me' && !SCENE.charged && !SCENE.busy && spEl.style.display!=='none';

function speechShow(){
  curPhrase=PHRASES[Math.floor(Math.random()*PHRASES.length)];
  document.getElementById('spRu').textContent=curPhrase.ru;
  document.getElementById('spEn').textContent=curPhrase.en;
  RT={silent:0, err:0, heard:0, again:0};
  armTap(false);
  spEl.style.display='block';
  listenTurn();
}
function speechHide(){ listenTok++; eqIdle(true); spEl.style.display='none'; }

async function listenTurn(note){
  const tok=++listenTok;
  const alive=()=> tok===listenTok && myTurnOpen();
  if(!alive()) return;
  eqIdle(false);
  spStatus(note||'🎙️ Слушаю - скажи фразу, банан зарядится сам', note?'#ffd23f':'#5ef2c9');
  const words=norm(curPhrase.en).split(' ').filter(Boolean).length;
  const r=await listenOnce(words, alive, eqDraw, ()=>{ eqIdle(true); spStatus('⏳ Распознаю…'); });
  eqIdle(true);
  if(r.cancel || tok!==listenTok) return;
  if(r.fail) return tapFallback(r.fail==='nomic'?'Микрофон недоступен':'Нет доступа к микрофону');
  if(!r.spoke){                                   // тишина: на сервер ничего не шлём, слушаем дальше
    if(++RT.silent>=2){ armTap(true); return listenTurn('Не слышу тебя - скажи громче или тапни по фразе'); }
    return listenTurn('Не слышу тебя - скажи погромче 🎙️');
  }
  if(r.err){
    if(++RT.err>=2) return tapFallback('Нет связи с распознаванием');
    return listenTurn('Не получилось распознать - повтори 🎙️');
  }
  const t=r.text;
  if(!t){
    if(++RT.heard<2) return listenTurn('Не расслышал - повтори чётче 🎙️');
    return charge(false, '');
  }
  if(matchPhrase(t,curPhrase.ans)) return charge(true, t);
  // автостоп мог обрезать фразу - одна бесплатная попытка, потом кривой заряд (правило Ромы)
  if(RT.again<1){ RT.again++; return listenTurn('Услышал: «'+t+'» - ещё раз!'); }
  charge(false, t);
}

function charge(ok, t){
  listenTok++; armTap(false); eqIdle(true);
  const ph=curPhrase;
  if(ok) spStatus(t?('✅ «'+t+'» - заряжено!'):'✅ Заряжено!', '#5ef2c9');
  else   spStatus('😅 '+(t?('«'+t+'» - не то!'):'Не разобрал.')+' Верно: '+ph.en+'. Бросок будет кривой', '#ffd23f');
  say(ph.en);
  setTimeout(()=>{
    if(!SCENE || SCENE.turn!=='me' || SCENE.busy) return;
    spEl.style.display='none';
    SCENE.charged=true; SCENE.missKick=!ok;
    SCENE.ui.hint.setText(ok?'⬅️ Потяни назад, как рогатку, и отпусти!':'🌀 Кривой заряд: бросок будет со сбивом!');
    SCENE.ui.hint.setVisible(true);
  }, ok?600:1200);
}

// Запасной путь: без микрофона голосом играть нельзя, но ход не должен вставать.
function armTap(on){ tapArmed=!!on; document.getElementById('spPhrase').classList.toggle('tap', tapArmed); }
function tapFallback(why){ armTap(true); spStatus(why+' - тапни по фразе, чтобы зарядить', '#ffd23f'); }
document.getElementById('spPhrase').addEventListener('click',()=>{ if(tapArmed && myTurnOpen()) charge(true, ''); });

// «послушать»: пока игра говорит, микрофон не слушает - иначе запишет саму себя
document.getElementById('spSay').addEventListener('click',()=>{
  if(!curPhrase) return;
  listenTok++; eqIdle(true); spStatus('🔊 Слушай…');
  let done=false; const back=()=>{ if(done) return; done=true; if(myTurnOpen()) listenTurn(); };
  try{ const u=new SpeechSynthesisUtterance(curPhrase.en); u.lang='en-US'; u.rate=.9; u.onend=back; u.onerror=back;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
  setTimeout(back, 3500);
});

/* Телефонный формат и на компьютере: колонка шириной с телефон, высота окна. */
const appEl=document.getElementById('app');
function fitApp(){ appEl.style.width=Math.min(innerWidth, 520, Math.max(320, Math.round(innerHeight*0.62)))+'px'; }
fitApp(); addEventListener('resize', fitApp);

/* ── старт: меню -> игра ── */
function bootGame(){
  document.getElementById('menu').style.display='none';
  window.game=new Phaser.Game({
    type:Phaser.AUTO, parent:'game',
    width:CFG.W, height:CFG.H, backgroundColor:'#7fd3e6',
    scale:{mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_BOTH},
    scene:Arena,
  });
}
document.getElementById('mBot').addEventListener('click',()=>{
  wakeAudio();
  // поле всегда портретное, как на телефоне: ширина 900, высота по пропорции колонки
  const r=appEl.getBoundingClientRect();
  const W=900, H=Math.max(1100, Math.min(2000, Math.round(W*r.height/Math.max(1,r.width))));
  // карточка с фразой занимает около 215 px низа экрана - бойцы и земля не должны под неё уходить
  const baseY=Math.min(H-160, Math.round(H*0.76), Math.round(H-215/(r.width/W)-75));
  CFG={mode:'bot', W, H, baseY, seed:(Math.random()*1e9)|0};
  bootGame();
});
document.getElementById('mLive').addEventListener('click',async()=>{
  wakeAudio();
  if(typeof Colyseus==='undefined'){ toast('Мультиплеер не загрузился 😕'); return; }
  document.getElementById('searching').style.display='block';
  let name='Боец'; try{ name=(JSON.parse(localStorage.getItem('ek_island_v1')||'{}').name)||'Боец'; }catch(e){}
  try{
    const client=new Colyseus.Client(WSURL);
    const room=await client.joinOrCreate('worms_duel',{name});
    room.onMessage('start', st=>{
      const names={A:st.players[st.order[0]].name, B:st.players[st.order[1]].name};
      CFG={mode:'pvp', W:900, H:1600, seed:st.seed, room, mySid:room.sessionId, order:st.order, turn:st.turn, wind:st.wind, names};
      bootGame();
    });
    room.onMessage('shot', m=>{ SCENE&&SCENE.pvpIncomingShot(m); });
    room.onMessage('applyMove', m=>{ SCENE&&SCENE.pvpApplyMove(m); });
    room.onMessage('turn', m=>{ SCENE&&SCENE.pvpTurn(m); });
    room.onMessage('end', m=>{ SCENE&&SCENE.pvpEnd(m.winner,m.reason); });
    room.onLeave(()=>{});
  }catch(e){ document.getElementById('searching').style.display='none'; toast('Сервер боёв недоступен 🌴'); }
});
</script>
